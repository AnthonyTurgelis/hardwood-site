<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>National GM — The Hardwood</title><style>
:root{--ink:#171713;--paper:#f3efe4;--red:#b5222b;--muted:#67655d;--line:#cbc3b2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;border-bottom:3px solid var(--ink);align-items:end}.eyebrow,.tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.tag{color:var(--red)}h1{font:800 clamp(38px,7vw,76px)/.9 Georgia,serif;margin:22px 0 8px}.dek{max-width:760px;color:var(--muted);font-size:18px}.alert{border-left:5px solid var(--red);padding:12px 16px;background:#fff8;margin:24px 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}.card{border-top:2px solid var(--ink);padding-top:12px;margin-top:20px}h2{font:700 25px Georgia,serif}.five{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.player,.person{background:#fff8;border:1px solid var(--line);padding:12px}.rank{font:700 28px Georgia;color:var(--red)}.pool{width:100%;border-collapse:collapse}.pool td,.pool th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.muted{color:var(--muted);font-size:13px}a{color:inherit}@media(max-width:760px){.grid{grid-template-columns:1fr}.five{grid-template-columns:1fr 1fr}.pool th:nth-child(3),.pool td:nth-child(3){display:none}}
</style></head><body><main class="wrap"><div class="top"><div class="eyebrow">The Hardwood / Federation Desk</div><a href="index.html">Board</a></div><h1>Canada, from the GM chair.</h1><p class="dek">The verified national-team pool, a position-balanced five, federation leadership and the event result that defines what comes next.</p><div id="app"><p>Loading federation record…</p></div></main><script>
fetch('./national-gm.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.available)throw Error('unavailable');let five=d.players.filter(p=>p.lineup_rank);let ev=d.latest_event||{};let h=`<div class="alert"><b>Not in the 2026 World Cup field.</b> Canada finished ${ev.finish||'—'} at ${ev.event_name||'the qualifier'} (${ev.record||'—'}). This is a federation-desk flagship, not a simulated World Cup roster.</div><div class="grid"><section><div class="card"><div class="tag">Best available WNBA evidence</div><h2>Comparable impact leaders</h2><div class="five">${five.map(p=>`<div class="player"><div class="rank">${p.lineup_rank}</div><b>${p.name}</b><div class="muted">${p.team||'WNBA'} · ${Number(p.impact).toFixed(3)}</div></div>`).join('')}</div><p class="muted">${d.best_lineup_basis}</p></div><div class="card"><div class="tag">Official pool</div><h2>25 committed players</h2><table class="pool"><thead><tr><th>Player</th><th>WNBA</th><th>FIBA status</th><th>Naturalised</th></tr></thead><tbody>${d.players.map(p=>`<tr><td>${p.name}</td><td>${p.team||'—'}</td><td>${p.fiba_status}</td><td>${p.is_naturalised==null?'Not verified':p.is_naturalised?'Yes':'No'}</td></tr>`).join('')}</tbody></table><p class="muted">${d.scope} ${d.naturalised_rule}</p></div></section><aside><div class="card"><div class="tag">Federation</div><h2>Who runs the team</h2>${d.staff.map(x=>`<div class="person"><b>${x.person_name}</b><div>${x.role}</div><div class="muted">${x.since_date?'Since '+x.since_date:''}</div></div>`).join('')}</div><div class="card"><a href="${ev.source_url}">Official FIBA event record →</a></div></aside></div>`;document.querySelector('#app').innerHTML=h}).catch(()=>document.querySelector('#app').innerHTML='<div class="alert">Federation data is temporarily unavailable.</div>');
</script></body></html>
