<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hardwood WNBA game forecast, uncertainty, rotations, availability, and model provenance."><title>Game Report — Hardwood</title><link rel="stylesheet" href="hw-product.css"><style>.report-hero{padding:22px}.report-match{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;text-align:center}.report-team:first-child{text-align:left}.report-team:last-child{text-align:right}.report-team strong{display:block;font-size:clamp(38px,7vw,76px);line-height:.9}.report-call{font-size:clamp(25px,4vw,46px);font-weight:800}.report-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:13px;margin-top:13px}.report-stack{display:grid;gap:13px;align-content:start}.report-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.report-metric{padding:13px;border:1px solid var(--soft);border-radius:11px;background:rgba(255,255,255,.035)}.report-metric small{display:block;color:var(--muted)}.report-metric strong{display:block;margin:6px 0;font-size:24px}.report-steps>div,.report-context>div{padding:10px 0;border-bottom:1px solid var(--soft)}.report-steps b{color:var(--accent);float:right}.report-steps p,.report-context p{margin:4px 0 0;color:var(--muted)}.report-teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.report-provenance div{display:grid;grid-template-columns:110px 1fr;gap:9px;padding:8px 0;border-bottom:1px solid var(--soft)}.report-provenance dt{color:var(--muted)}.report-provenance dd{margin:0;font:11px var(--mono);overflow-wrap:anywhere}@media(max-width:950px){.report-grid{grid-template-columns:1fr}.report-metrics{grid-template-columns:1fr 1fr}}@media(max-width:650px){.report-match{grid-template-columns:1fr 1fr}.report-center{grid-column:1/-1;grid-row:1}.report-teams{grid-template-columns:1fr}}@media print{.hw-topbar,.hw-footer,.print{display:none!important}.hw-page{width:100%;padding:0}.hw-card{box-shadow:none;break-inside:avoid}.report-grid{display:block}.report-stack{display:block}}</style></head><body class="hw-product" data-section="games"><main class="hw-page"><div id="loading" class="hw-card hw-loading">Loading game report…</div><div id="error" class="hw-card hw-empty" hidden></div><article id="report" hidden><header class="hw-card report-hero"><div class="hw-game-meta"><span id="date"></span><span id="built"></span></div><div class="report-match"><div class="report-team"><small>Away</small><strong id="away">—</strong><span id="awayp"></span></div><div class="report-center"><div class="hw-kicker">Hardwood forecast</div><div class="report-call" id="call">—</div></div><div class="report-team"><small>Home</small><strong id="home">—</strong><span id="homep"></span></div></div><div class="hw-prob"><span id="bar" style="width:50%"></span></div></header><div class="report-grid"><div class="report-stack"><section class="hw-card"><div class="hw-card-head"><h3>Forecast and uncertainty</h3><button class="hw-button print" onclick="print()">Print / PDF</button></div><div class="hw-card-body report-metrics" id="metrics"></div></section><section class="hw-card"><div class="hw-card-head"><h3>How the margin is built</h3></div><div class="hw-card-body report-steps" id="steps"></div></section><section class="hw-card"><div class="hw-card-head"><h3>Projected rotations</h3></div><div class="hw-card-body report-teams" id="rotations"></div></section></div><aside class="report-stack"><section class="hw-card"><div class="hw-card-head"><h3>Availability and setup</h3></div><div class="hw-card-body report-context" id="context"></div></section><section class="hw-card"><div class="hw-card-head"><h3>Fair number</h3></div><div class="hw-card-body" id="fair"></div></section><section class="hw-card"><div class="hw-card-head"><h3>Provenance</h3></div><dl class="hw-card-body report-provenance" id="prov"></dl></section><section class="hw-card"><div class="hw-card-body"><a class="hw-button primary" id="pdf" hidden>Original PDF</a> <a class="hw-button" href="games.html">Back to games</a></div></section></aside></div></article></main><script src="hw-product.js"></script><script>(()=>{"use strict";const $=x=>document.getElementById(x),n=v=>{let x=Number(v);return v==null||v===""||!isFinite(x)?null:x},f=(v,d=1)=>n(v)==null?"—":n(v).toFixed(d),s=(v,d=1)=>n(v)==null?"—":`${n(v)>0?"+":""}${n(v).toFixed(d)}`,p=v=>{let x=n(v);if(x==null)return"—";if(x<=1)x*=100;return`${x.toFixed(0)}%`},e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),id=(new URLSearchParams(location.search).get("game_id")||new URLSearchParams(location.search).get("id")||"").match(/^[\w.-]+$/)?.[0];function metric(a,b,c){return`<div class="report-metric"><small>${e(a)}</small><strong>${e(b)}</strong><span>${e(c)}</span></div>`}function team(name,rows){let body=(rows||[]).sort((a,b)=>(n(b.min)||-1)-(n(a.min)||-1)).map(x=>`<tr><td><strong>${e(x.name)}</strong></td><td class="num">${f(x.min)}</td><td class="num">${s(x.impact)}</td><td class="num">${f(x.pts)}</td><td class="num">${f(x.reb)}</td><td class="num">${f(x.ast)}</td></tr>`).join("")||'<tr><td colspan="6">No rotation published.</td></tr>';return`<div class="hw-table-wrap"><table class="hw-table"><thead><tr><th>${e(name)}</th><th class="num">MIN</th><th class="num">Impact</th><th class="num">PTS</th><th class="num">REB</th><th class="num">AST</th></tr></thead><tbody>${body}</tbody></table></div>`}function render(d){let hp=n(d.p_home_win);if(hp!=null&&hp>1)hp/=100;let ap=hp==null?null:1-hp,m=d.margin||{},t=d.total||{},home=d.home||"Home",away=d.away||"Away";$("away").textContent=away;$("home").textContent=home;$("awayp").textContent=ap==null?"Probability not published":`${p(ap)} win`;$("homep").textContent=hp==null?"Probability not published":`${p(hp)} win`;$("bar").style.width=`${hp==null?50:Math.max(2,Math.min(98,hp*100))}%`;$("call").textContent=d.call||"Forecast not published";$("date").textContent=d.date||"Date not published";$("built").textContent=d.generated_utc?`Built ${d.generated_utc}`:"Build time not published";$("metrics").innerHTML=[metric("Home margin",s(m.point),`Positive favors ${home}`),metric("Home win chance",p(hp),home),metric("Projected total",f(t.point),`Range ${f(t.lo)}–${f(t.hi)}`),metric("80% margin range",n(m.lo80)==null?"—":`${s(m.lo80)} to ${s(m.hi80)}`,"Final home margin")].join("");$("steps").innerHTML=(d.why?.steps||[]).map(x=>`<div><strong>${e(x.label)}</strong><b>${e(x.value)}</b><p>${e(x.detail||"")}</p></div>`).join("")||"No component chain published.";$("rotations").innerHTML=team(d.away_full||away,d.box?.away)+team(d.home_full||home,d.box?.home);$("context").innerHTML=[[d.away_full||away,d.context?.away],[d.home_full||home,d.context?.home]].map(x=>`<div><strong>${e(x[0])}</strong><p>${e(x[1]||"No setup note published.")}</p></div>`).join("");let fair=d.fair_value||{};$("fair").innerHTML=`<div class="report-metrics" style="grid-template-columns:1fr 1fr">${metric("Our spread",fair.our_spread||d.call||"—",fair.label||"published fair number")}${metric("Our total",f(fair.our_total||t.point),fair.market_pending?"Market comparison pending":"Market comparison available")}</div>`;$("prov").innerHTML=[["Game ID",id],["Forecast built",d.generated_utc],["Model as of",d.why?.as_of],["Margin",m.point],["Total",t.point],["Win probability",d.p_home_win],["Data note",d.note]].map(x=>`<div><dt>${e(x[0])}</dt><dd>${e(x[1]??"Not published")}</dd></div>`).join("");if(d.pdf){$("pdf").href=d.pdf;$("pdf").hidden=false}$("loading").hidden=true;$("report").hidden=false}if(!id){$("loading").hidden=true;$("error").hidden=false;$("error").innerHTML='<h2>No game selected</h2><a class="hw-button" href="games.html">Choose a game</a>'}else fetch(`games/${encodeURIComponent(id)}.json`,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(`Report returned ${r.status}`);return r.json()}).then(render).catch(err=>{$("loading").hidden=true;$("error").hidden=false;$("error").innerHTML=`<h2>Report unavailable</h2><p>${e(err.message)}</p><a class="hw-button" href="games.html">Back to games</a>`})})();</script></body></html>
