<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hardwood — Team</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#161a21;--muted:#5a6675;--line:#e3e7ee;--acc:#2b6cb0;--good:#1f883d;--bad:#c62828} @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--muted:#9aa7b4;--line:#303844;--acc:#58a6ff;--good:#3fb950;--bad:#ff7b72}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}header,main,nav{max-width:1060px;margin:auto}header{padding:18px 16px 8px}h1{font-size:25px;margin:0}.sub,.note{color:var(--muted)}nav{padding:0 16px 10px}nav a{color:var(--acc);text-decoration:none;margin-right:14px}main{padding:4px 16px 50px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:10px}.hero{padding:14px 16px;margin-bottom:12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.metric{padding:10px;border-left:3px solid var(--acc)}.metric b{display:block;font-size:20px}.metric span{color:var(--muted);font-size:11px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 7px}.card{overflow:hidden}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:10px;text-transform:uppercase;color:var(--muted)}td.num,th.num{text-align:right}.player{display:flex;align-items:center;gap:8px}.player img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--line)}a{color:var(--acc)}.win{color:var(--good);font-weight:700}.loss{color:var(--bad);font-weight:700}.empty{padding:14px;color:var(--muted)}
</style><!--hw-chrome-style--><style>.hw-chrome nav{display:flex;flex-wrap:wrap;gap:.25rem 1rem;align-items:center}.hw-chrome a{text-decoration:none}.hw-tab[aria-current=page]{font-weight:700;text-decoration:underline}.hw-chrome-foot{margin-top:2rem;padding-top:.75rem;border-top:1px solid rgba(128,128,128,.35);font-size:.85rem}.hw-chrome-foot .util{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin-bottom:.75rem}</style><!--/hw-chrome-style--></head><body>
<header><h1 id="title">Team</h1><div class="sub" id="stamp">Loading current team facts…</div></header>
<!--hw-nav--><nav class="hw-nav" aria-label="Primary"><a class="hw-tab" href="games.html">Games</a><a class="hw-tab" href="teams.html">Teams</a><a class="hw-tab" href="players.html">Players</a><a class="hw-tab" href="standings.html">Standings &amp; Injuries</a><a class="hw-tab" href="accuracy.html">Accuracy</a><a class="hw-tab" href="primer.html">Learn</a></nav><!--/hw-nav-->
<main id="main"><div class="hero">Loading…</div></main>
<script>
(function(){
"use strict";
var VALID=["ATL","CHI","CON","DAL","GSV","IND","LAS","LVA","MIN","NYL","PHO","POR","SEA","TOR","WAS"];
var q=new URLSearchParams(location.search), team=(q.get("team")||"").toUpperCase();
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function pct(v){return v==null?"—":(Number(v)*100).toFixed(1)+"%"}
function record(games,where){var x={w:0,l:0,pf:0,pa:0};games.filter(where).forEach(function(g){var home=g.home===team,pf=home?g.home_score:g.away_score,pa=home?g.away_score:g.home_score;x.pf+=pf;x.pa+=pa;if(pf>pa)x.w++;else x.l++});return x}
function recText(x){return x.w+"–"+x.l}
function metric(label,value){return '<div class="metric"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>'}
function gameRow(g,future){var home=g.home===team,opp=home?g.away:g.home,site=home?"vs":"@";if(future)return '<tr><td>'+esc(g.date)+'</td><td>'+site+' '+esc(opp)+'</td><td>'+esc(g.tip_et||"TBD")+'</td><td class="num">'+esc(g.call||"—")+'</td></tr>';var pf=home?g.home_score:g.away_score,pa=home?g.away_score:g.home_score,w=pf>pa;return '<tr><td>'+esc(g.date)+'</td><td>'+site+' '+esc(opp)+'</td><td class="'+(w?'win':'loss')+'">'+(w?'W ':'L ')+pf+'–'+pa+'</td><td class="num">'+(pf-pa>0?'+':'')+(pf-pa)+'</td></tr>'}
function table(head,rows,empty){return '<div class="card scroll"><table><thead><tr>'+head.map(function(h){return'<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.join('')||'<tr><td class="empty" colspan="9">'+empty+'</td></tr>')+'</tbody></table></div>'}
if(VALID.indexOf(team)<0){document.getElementById("main").innerHTML='<div class="hero">Choose a team from the <a href="teams.html">team board</a>.</div>';return}
Promise.all(["teams.json","standings.json","players/index.json","roster_meta.json","finals.json","games.json"].map(function(f){return fetch(f,{cache:"no-cache"}).then(function(r){if(!r.ok)throw Error(f+" unavailable");return r.json()})})).then(function(d){
 var power=d[0].teams.find(function(x){return x.team===team})||{}, standing=d[1].teams.find(function(x){return x.team===team})||{}, idx=d[2].players||[], bios=d[3].players||{}, finals=(d[4].games||[]).filter(function(g){return g.home===team||g.away===team}), future=(d[5].games||[]).filter(function(g){return g.home===team||g.away===team});
 var name=standing.team_full||power.team_full||team, all=record(finals,function(){return true}), home=record(finals,function(g){return g.home===team}), away=record(finals,function(g){return g.away===team}), close=record(finals,function(g){return Math.abs(g.home_score-g.away_score)<=5});
 document.title=name+" — The Hardwood";document.getElementById("title").textContent=name;document.getElementById("stamp").textContent="2026 team page · updated "+(d[1].generated_utc||d[0].generated_utc||"with the latest bake");
 var roster=idx.filter(function(p){return p.team===team}).sort(function(a,b){return (a.rank||999)-(b.rank||999)}).map(function(p){var b=bios[String(p.id)]||{};return '<tr><td><div class="player">'+(b.headshot_url?'<img src="'+esc(b.headshot_url)+'" alt="">':'')+'<a href="player.html?id='+encodeURIComponent(p.id)+'">'+esc(p.name)+'</a></div></td><td>'+esc(b.position||"—")+'</td><td>'+esc(b.jersey||"—")+'</td><td class="num">'+esc(p.rank||"—")+'</td><td class="num">'+esc(p.rating==null?"—":Number(p.rating).toFixed(1))+'</td></tr>'});
 var recent=finals.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,8).map(function(g){return gameRow(g,false)}), next=future.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).map(function(g){return gameRow(g,true)});
 document.getElementById("main").innerHTML='<div class="hero"><div class="metrics">'+metric("Record",recText(all))+metric("Win rate",pct(standing.win_pct))+metric("Power rank",power.rank?"#"+power.rank:"—")+metric("Team strength",power.strength==null?"—":Number(power.strength).toFixed(1))+metric("Playoff chance",pct(standing.p_playoff))+metric("Title chance",pct(standing.p_title))+'</div></div><div class="grid"><section><h2>Roster</h2>'+table(["Player","Pos","No.","Player rank","Rating"],roster,"No current roster rows are available.")+'</section><section><h2>Season splits</h2>'+table(["Split","Record","PF","PA"],[['Overall',all],['Home',home],['Away',away],['Games within 5',close]].map(function(x){return'<tr><td>'+x[0]+'</td><td>'+recText(x[1])+'</td><td class="num">'+x[1].pf+'</td><td class="num">'+x[1].pa+'</td></tr>'}),"No played games are available.")+'</section></div><section><h2>Recent results</h2>'+table(["Date","Opponent","Result","Margin"],recent,"No completed games are available.")+'</section><section><h2>Remaining schedule</h2>'+table(["Date","Opponent","Tip","Current projection"],next,"No remaining games are currently published.")+'</section><p class="note">Roster follows the current player index. Results come from finals of record; schedule and projections come from the current games feed. Market data is not an input to team strength or game projections.</p>';
}).catch(function(e){document.getElementById("main").innerHTML='<div class="hero">Could not load this team page. '+esc(e.message)+'</div>'});
})();
</script><!--hw-foot--><footer class="wrap hw-chrome-foot"><div class="util"><a href="review.html">Daily Review</a><a href="report_archive.html">Report Archive</a><a href="deepdive.html">Deep Dives</a><a href="compare.html">Compare</a><a href="situation.html">Situations</a><a href="explorer.html">Data Explorer</a><a href="error-map.html">Error Map</a><a href="board.html">Board</a></div><div>The Hardwood - a WNBA prediction and simulation project. Not affiliated with the WNBA.</div></footer><!--/hw-foot--></body></html>
