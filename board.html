      //   Tier 1  PRODUCT — tonight's picks, tonight's edge, game reports.
      //   Tier 2  secondary reader value — what we learned, the daily-review watch list.
      //   Tier 3  crew / ops chrome — running now, done today, helper jobs, the monitor ticker; these
      //           carry no reader value up front, so they always land at the bottom, never in prime space.
      // Within a tier we still sort MOST-RECENT first (section as_of DESC), then by declared order, so
      // picks lead reports and a stale panel sinks inside its own tier. An empty "Needs you" is not a
      // decision, so it drops to Tier 3. running_live is the LIVE-gated list (empty means nothing is
      // running — never fall back to the delta cards, which can hold stale/finished entries);
      // only a legacy snapshot with no running_live at all falls back to running_now.
      var live=(sec.running_live!=null)? sec.running_live : sec.running_now;
      var decActionable=!!((sec.needs_anthony && sec.needs_anthony.length) || (b.setup && b.setup.length));
      var panels=[];
      // Keep the BR-V2 tier ordering (product leads, crew chrome sinks) AND graft in the
      // look-upgrade's Foul-Trouble Watch panel (tier 1, beside tonight's games).
      function addPanel(node, key, tier){ if(node){ panels.push({node:node, asOf:secAsOf(key), tier:tier, i:panels.length}); } }
      addPanel(renderDecisions(sec.needs_anthony, b.setup, b.answer_all), "needs_anthony", decActionable?0:3);
      addPanel(renderTodayGames(sec.today_games), "today_games", 1);
      // FOUL-TROUBLE WATCH removed from the homepage (CEO 20260725: "why is the foul model on the
      // homepage" + it was surfacing 13h-stale data on a no-games day). renderFoulWatch() is retained
      // below so it can be remounted on a dedicated page (fresh-gated) if wanted later — data untouched.
      // addPanel(renderFoulWatch(FOUL), "foul_risk", 1);
      addPanel(renderTonightEdge(sec.tonight_edge), null, 1);
      addPanel(renderReports(b.reports, b.rollover), "reports", 1);
      addPanel(renderCoverageTile(ACC), "accuracy_cov", 2);
      addPanel(renderAgentUpdates(sec.agent_updates), "agent_updates", 2);
      addPanel(renderWatch(sec.watch_list), "watch_list", 2);
      addPanel(renderRunning(live), "running_now", 3);
      addPanel(renderDone(sec.done_today), "done_today", 3);
      addPanel(renderHelpers(b.helpers), null, 3);
      addPanel(renderScoutActivity(b.scout_activity), "scout_activity", 3);
      panels.sort(function(a,c){
        if(a.tier!==c.tier) return a.tier-c.tier;  // product tiers first, crew/ops chrome last
        var av=a.asOf||"", cv=c.asOf||"";          // within a tier: most-recent panel first
        if(av!==cv) return av<cv?1:-1;             // as_of DESC
        return a.i-c.i;                             // stable: declared order on ties (picks before reports)
      });
      panels.forEach(function(p){ main.appendChild(p.node); });
    } else {
      main.appendChild(renderQueue(sec.upcoming, sec.coming_soon, !!viewDate));
    }
    // LIVENESS LINE, per the Director ruling of Aug 14. The rule lives HERE, on the board it
    // beside the clock it refers to — a liveness rule kept in a directive someone has to go find
    // is not a glance. Fresh means alive however noisy the cards look; the cards are allowed to be
    // ugly, the clock is the pulse. The word for the recovery tool is deliberately avoided: it is
    // a flagged term and this is a CORE surface, so writing it here would abort the bake outright.
    document.getElementById("foot").textContent =
      "Auto-generated from the working record. Last refreshed " + (b.generated_et||"") +
      ". Every number on this page is baked in advance; your browser never touches a database." +
      " Is it alive? This page own clock above is the pulse: refreshed 2 minutes ago or less means" +
      " alive, however noisy the cards look. More than 5 minutes means stale, and the 3:49 card" +
      " says what to run.";
    tickElapsed(); tickProv(); tickStrip();
    flash();
  }
  function rerender(){ render(viewDate && snapB ? snapB : (lastLive||lastB)); }

  /* ---------- BOARD STATUS STRIP: "are these numbers current, and is anything paused" ----------
     THE GAP THIS FILLS: every other tab loads hardwood.js, which injects a status strip carrying a
     page-level staleness sentence and the pause state. This page never loaded that script, so the
     one page that actually gets opened was the only one where a three-hour-dead board and a healthy
     board looked identical, and it never showed a pause at all.

     NO SECOND AUTHORITY — both readings come from producers that already exist:
       * freshness: this board's OWN published clock (generated_utc) measured against its OWN
         published contract (freshness.stale_after_secs), the same pair the panel badges and the
         other tabs' banner already use. The age comes from sinceIso(), so this sentence and the
         header freshness chip can never quote two different numbers.
       * pause: the `pause` block of ./status.json — the single published pause reading (the same one
         the spawn gate itself consults), already polled by every other tab. We RENDER its state;
         we never derive one. A read that did not land says so instead of implying "running".
     Recomputed in the browser once a second, deliberately: a board that stops being republished
     never re-renders, so a staleness sentence baked server-side would freeze at "fresh" exactly when
     it mattered. The reader's clock is the only thing that can still go loud on a dead page.

     COPY RULES: ASCII only (a curly dash written here has come back as garbage on this box), plain
     English, and no internals — no file names, no identifiers, no clocks the reader has to subtract.
     "updated 3 minutes ago", never a timestamp. */
  var PAUSE=null;        // the published `pause` block; null until a real read lands
  var PAUSE_OK=false;    // did the last read actually deliver one? never assume "fine" on a miss
  var PAUSE_TRIED=false; // "not asked yet" is NOT the same as "asked and could not tell" — the first
                         // second of a page load must not flash an alarm it has not earned
  function setPause(p, okFlag){ PAUSE=(p && typeof p==="object")?p:null; PAUSE_OK=!!okFlag;
    PAUSE_TRIED=true; }
  /* Plain-English age. The header chips use the terse "3m"; a sentence a human reads wants words.
     It TRUNCATES exactly as agoSecs() does, deliberately: rounding here instead read "updated 2
     minutes ago" beside a chip reading "updated 1m ago" on the same header, off the same one
     timestamp. Under a minute it quotes no number at all, so it cannot disagree with the chip's
     ticking seconds either. */
  function plainAgo(s){
    if(s==null) return "";
    s=Math.max(0,s);
    if(s<60) return "just now";
    if(s<3600){ var m=Math.floor(s/60); return (m===1?"a minute ago":m+" minutes ago"); }
    if(s<86400){ var h=Math.floor(s/3600), rm=Math.floor((s%3600)/60);
      return (h===1?"an hour":h+" hours")+(rm?(" and "+(rm===1?"a minute":rm+" minutes")):"")+" ago"; }
    var d=Math.floor(s/86400); return (d===1?"a day ago":d+" days ago");
  }
  function plainMins(s){ var m=Math.round((s||0)/60); return (m<=1?"minute":m+" minutes"); }
  /* The LOUD threshold is not ours to invent. The board's own stale_after_secs is when a refresh is
     DUE; the alarm the machine itself raises on the public board fires at max(that, a 900s floor) —
     the floor exists so ordinary publish and content-delivery lag never cries wolf. The suite pins
     this constant to that same value, so this page and the alarm can never drift into disagreeing
     about what counts as stale. */
  var PUB_FLOOR_SECS=900;
  function loudAfterSecs(){ return Math.max(staleAfterSecs(), PUB_FLOOR_SECS); }
  function freshView(genIso, nowMs, workPaused, snapDate){
    if(snapDate){
      // ALWAYS shown, even though it is not a fault: a reader looking at an archived day must never
      // mistake it for tonight. `always` is what earns a line on a strip that otherwise stays quiet.
      return {level:"ok", stale:false, age:null, always:true,
        text:"You are reading a saved copy of the board from "+snapDate+", not the live one."};
    }
    var t=genIso? new Date(genIso).getTime() : NaN;
    if(!genIso || isNaN(t)){
      // HONEST UNAVAILABLE, never an invented age: a board that published no time is a board whose
      // freshness we do not know, and saying so beats printing a number nothing supports.
      return {level:"warn", stale:false, age:null,
        text:"We cannot tell how fresh these numbers are - the board did not publish a time. "+
             "Treat nothing here as current until that is fixed."};
    }
    var age=Math.max(0,Math.round((nowMs-t)/1000));
    /* ONE CALM BAND, ALL THE WAY TO THE ALARM (CEO 20260730: "So much stale, so wordy" — the board
       was greeting him with "A refresh is running late - these numbers were updated 5 minutes ago,
       and the board aims to refresh every 5 minutes", i.e. apologising for being on time).
       That middle rung was never a fault: the bake lands on a 300s cadence whose gaps exceed 300s
       49.7% of the time (n=1760 gaps over 7d in logs/board_bake.log; p99 895s), and the publish +
       Pages + CDN hop adds more on top — measured at 390s of live staleness at 18:32Z on 2026-07-30
       while the machine's own pager recorded stale:false. So the board spent much of every healthy
       day announcing a problem its own monitor did not have. DELETED, not retuned: the loud line
       below fires at the number publish_health.py actually alarms on, and everything short of that
       is calm. The board's own stale_after_secs contract still DERIVES that threshold
       (loudAfterSecs) — it simply no longer draws a banner of its own. */
    if(age<=loudAfterSecs()){
      return {level:"ok", stale:false, age:age,
        text:"These numbers are current - updated "+plainAgo(age)+"."};
    }
    if(workPaused){
      /* FALSE-STALE GUARD — the same distinction the quiet panel badge draws. When work is paused on
         purpose, an ageing board is the EXPECTED consequence, not a broken publisher. State the age
         just as plainly, name the real reason, and do not paint it as a fault. */
      return {level:"warn", stale:true, age:age,
        text:"These numbers were updated "+plainAgo(age)+", so they are out of date - because work "+
             "is paused. Nothing new arrives until work restarts."};
    }
    /* QUOTE THE THRESHOLD THAT ACTUALLY FIRED, not the schedule. This used to end "and the board aims
       to refresh every 5 minutes" while the banner had in fact waited for the 15-minute alarm floor,
       naming a number that was not the reason it was on screen. */
    return {level:"bad", stale:true, age:age,
      text:"STALE - these numbers were last updated "+plainAgo(age)+", well past the "+
           plainMins(loudAfterSecs())+" we allow before treating the board as out of date. "+
           "Do not trust anything on this page until it refreshes."};
  }
  /* How much of the work limit is used, only ever as well as we actually know it. A number is
     printed ONLY when the reading is a real one; an unread meter says it is unread. (A meter that
     scraped a plausible-looking number out of an unrelated file and showed it as real is exactly the
     failure this wording exists to make impossible.) */
  function pctSentence(pc){
    if(!pc || typeof pc!=="object") return "We cannot read how much of our work limit is used.";
    var q=String(pc.quality||"UNKNOWN").toUpperCase(), d=pc.display;
    if(q==="MEASURED" && d) return "We have used "+d+" of our work limit.";
    if(q==="INFERRED" && d) return "We have used about "+d+" of our work limit, and that figure is "+
      "an estimate rather than a direct reading.";
    return "We cannot read how much of our work limit is used right now.";
  }
  /* ONE pause sentence, under ONE order of precedence: an outside limit outranks a pause we filed
     ourselves, which outranks the coordinator's own beacon. A pause we filed for the WEEK and a
     short one are genuinely different situations — the weekly kind never restarts by itself — so
     they never render in the same words. */
  function workView(p, bc, ok){
    bc=bc||{};
    if(!ok || !p || typeof p!=="object"){
      return {level:"warn", paused:false,
        text:"We cannot tell whether work is paused right now - that reading did not load. "+
             "Nothing here says it is running."};
    }
    var st=String(p.state||"UNKNOWN").toUpperCase();
    var sp=p.self_pause||{}, pl=p.provider_limit||{}, pc=p.percent||{};
    if(st==="PROVIDER_LIMIT"){
      var back=(pl.resets_known && pl.resets_clock)
        ? ("Work restarts when that clears, around "+pl.resets_clock+".")
        : "They have not said when it clears, so we are waiting on them.";
      return {level:"bad", paused:true,
        text:"STOPPED FROM OUTSIDE - we have hit the limit on our account, so nothing is running. "+
             back+" "+pctSentence(pc)};
    }
    if(st==="SELF_PAUSE"){
      var kind=String(sp.kind||"unknown").toLowerCase();
      var since=sp.filed_clock? (" It has been paused since "+sp.filed_clock+".") : "";
      if(kind==="weekly"){
        return {level:"bad", paused:true,
          text:"PAUSED BY US FOR THE WEEK - this kind never restarts by itself. It stays paused "+
               "until someone here starts it again."+since+" "+pctSentence(pc)};
      }
      if(kind==="rolling"){
        return {level:"warn", paused:true,
          text:"PAUSED BY US FOR A SHORT WHILE - this kind clears itself once the limit resets, and "+
               "work carries on on its own."+since+" "+pctSentence(pc)};
      }
      return {level:"bad", paused:true,
        text:"PAUSED BY US, and we could not read which kind of pause it is - so it is being treated "+
             "as the kind that never restarts by itself, and it stays paused until someone here "+
             "starts it again."+since+" "+pctSentence(pc)};
    }
    if(st!=="NORMAL"){
      return {level:"bad", paused:true,
        text:"WE CANNOT TELL whether work is paused - the pause note could not be read, and an "+
             "unreadable one counts as paused. Someone here has to look. "+pctSentence(pc)};
    }
    var bs=String(bc.state||"").toLowerCase();
    if(bs==="paused"){
      return {level:"warn", paused:true,
        text:"PAUSED ON PURPOSE for a while"+
             (bc.usage_resets_clock?(" - work should be back around "+bc.usage_resets_clock):"")+"."+
             (bc.note?(" "+bc.note):"")};
    }
    if(bs==="idle"){
      return {level:"bad", paused:false,
        text:"WORK HAS STOPPED and needs attention"+
             (bc.idle_since_clock?(" - nothing has been running since "+bc.idle_since_clock):"")+"."+
             (bc.note?(" "+bc.note):"")};
    }
    return {level:"ok", paused:false, text:"Nothing is paused - work is running normally."};
  }
  /* Draw the strip. Called from render() AND from the 1-second tick, so a frozen page still crosses
     its own staleness line. Deliberately carries no lane or slot counts: the helper panel owns that
     arithmetic, and a second place quoting it is how a page ends up contradicting itself. */
  /* AT MOST ONE LINE, AND ONLY WHEN SOMETHING IS WRONG (CEO 20260730: "CEO LENS. THE FRONT PAGE IS
     FOR THE FUCKING CEO" — the board opened with two full-width operator banners, one of them
     "Nothing is paused - work is running normally", above the night's call).
     Two banners that both say "fine" are two lines of nothing: the reader's question is answered by
     their ABSENCE, and the header's own freshness chip already carries the age where he can find it.
     So a healthy board renders NOTHING here, and an unhealthy one renders exactly one sentence,
     under a stated precedence: a stopped or paused crew OUTRANKS an ageing page, because a paused
     crew is WHY the page is ageing — showing both would be the same fact twice, which is the
     duplication the two-banner split was introduced to kill and then reintroduced by always
     painting both. Nothing is lost: the freshness line still fires on its own whenever work is
     healthy and the board has genuinely gone stale.
     TWO RULES, the same pair site/hardwood.js applies to every other tab, so the board and every
     other page cannot describe the same machine differently. (Both places here used to say "the
     other 22 tabs" - true when written, wrong within days, because the tab count only ever grows.
     site/hardwood.js corrected its own copy of that tally on 2026-07-31 for the same reason. The
     count is a grep, never prose: this particular tally was quoted back at us in a queue item
     asserting the board had no status strip at all - work raised against the very comment that
     documents the strip it says is missing. "Every other tab" cannot go stale.):
       1. A LINE IS FOR WORK THAT HAS ACTUALLY STOPPED - paused by us, stopped from outside, or an
          unreadable pause note that we fail closed and treat as stopped. "We cannot tell whether
          work is paused, that reading did not load" is an operator diagnostic he cannot act on; it
          belongs on the operator console, not above tonight's call.
       2. STALENESS OUTRANKS the work line. The freshness sentence fires only at genuine staleness
          now, and its paused variant already names the pause as the cause, so it says strictly more
          than the work line would - in one line rather than two. */
  function tickStrip(){
    var host=document.getElementById("bstrip"); if(!host) return;
    host.innerHTML="";
    if(!lastB){
      host.appendChild(el("div","bline","Checking whether the board is up to date..."));
      return;
    }
    var work=PAUSE_TRIED
      ? workView(PAUSE, lastB.beacon, PAUSE_OK)
      : {level:"", paused:false, text:"Checking whether anything is paused..."};
    var fresh=freshView(lastB.generated_utc, Date.now(), work.paused, viewDate);
    if(fresh.always || (fresh.level && fresh.level!=="ok")){
      host.appendChild(el("div","bline "+fresh.level, fresh.text));
    } else if(work.paused || work.level==="bad"){
      host.appendChild(el("div","bline "+work.level, work.text));
    } else if(work.level==="warn"){
      /* The remaining case is "we cannot tell whether work is paused" - the reading did not load.
         Silence on THAT question reads as "fine", so it is never dropped; but it is not an alarm
         either, so it renders in the strip's plain muted style rather than the amber wash. One
         line, no colour, and only when a read genuinely failed. */
      host.appendChild(el("div","bline", work.text));
    }
  }

  /* ---------- live runtime: poll own JSON, ETag, ago-chip, flash ---------- */
  var URL="./board.json", etag=null,lastMod=null,lastFetch=0,cardHTML={},first=true;
  function updAgo(){
    var s=Math.max(0,Math.round((Date.now()-lastFetch)/1000));
    var t = s<60 ? (s+"s ago") : (Math.floor(s/60)+"m "+(s%60)+"s ago");
    var a=document.getElementById("ago"); if(a) a.innerHTML = lastFetch? ("live · checked <b>"+t+"</b>") : "";
  }
  function flash(){
    var nodes=document.querySelectorAll("#main [data-k]"), nm={};
    for(var i=0;i<nodes.length;i++){ var n=nodes[i]; var k=n.getAttribute("data-k"), h=n.innerHTML; nm[k]=h;
      if(!first && cardHTML[k]!==undefined && cardHTML[k]!==h){ n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash"); } }
    cardHTML=nm; first=false;
  }
  function poll(){
    var h={}; if(etag)h["If-None-Match"]=etag; if(lastMod)h["If-Modified-Since"]=lastMod;
    // A++ honest refreshing state: flag the in-flight fetch + tick so the chip shows "refreshing…"
    // while the request is genuinely open; cleared (and re-ticked to truth) in BOTH branches below.
    boardFetching=true; tickChips();
    fetch(bust(URL),{headers:h,cache:"no-cache"}).then(function(r){
      if(r.status===304) return null;
      etag=r.headers.get("ETag")||etag; lastMod=r.headers.get("Last-Modified")||lastMod; return r.json();
    }).then(function(b){ boardFetching=false; lastFetch=Date.now(); if(b){ lastLive=b; if(!viewDate){ render(b); } else { healthChips(b); } } else { tickChips(); }
      // A++++: a completed fetch (200 or 304) IS a revalidation tick — record this poll's per-panel
      // verdicts (SRC is now current from render), then re-tick so the crown's history spark redraws.
      recordFreshHist(); tickChips(); updAgo(); }).catch(function(e){
      boardFetching=false; tickChips();
      if(!lastFetch){ document.getElementById("main").innerHTML='<p class="empty">Could not load the board (board.json). '+(e&&e.message?e.message:"")+'</p>'; }
    });
  }
  poll(); setInterval(poll,60000);
  /* foul-risk feed — polled independently of the board; graceful-null on 404/absent so the
     panel simply does not appear until the feed lands. */
  function pollFoul(){
    fetch(bust("./foul_risk.json"),{cache:"no-cache"}).then(function(r){ return r.ok? r.json() : null; })
      .then(function(j){ if(j){ var changed=JSON.stringify(j)!==JSON.stringify(FOUL); FOUL=j;
        if(changed && !viewDate && lastLive){ render(lastLive); } } }).catch(function(){});
  }
  pollFoul(); setInterval(pollFoul,60000);
  /* accuracy scorecard feed — polled independently of the board (same pattern as foul-risk). The
     HOME coverage tile is single-sourced from ./accuracy.json; graceful-null on 404/absent so the
     tile simply does not appear until the scorecard lands. Slow feed (re-bakes ~daily) -> 5-min poll. */
  function pollAccuracy(){
    fetch(bust("./accuracy.json"),{cache:"no-cache"}).then(function(r){ return r.ok? r.json() : null; })
      .then(function(j){ if(j){ var changed=JSON.stringify(j)!==JSON.stringify(ACC); ACC=j;
        if(changed && !viewDate && lastLive){ render(lastLive); } } }).catch(function(){});
  }
  pollAccuracy(); setInterval(pollAccuracy,300000);
  /* published slate feed — the numeric margin knots the hero cards DRAW their range from. Polled
     independently of the board (same pattern as foul-risk/accuracy); graceful-null on 404/absent so
     a card simply falls back to the baked sentence until the slate lands. */
  function pollSlate(){
    fetch(bust("./games.json"),{cache:"no-cache"}).then(function(r){ return r.ok? r.json() : null; })
      .then(function(j){ if(j){ var changed=JSON.stringify(j)!==JSON.stringify(SLATE); SLATE=j;
        if(changed && !viewDate && lastLive){ render(lastLive); } } }).catch(function(){});
  }
  pollSlate(); setInterval(pollSlate,60000);
  /* PAUSE STATE — polled from ./status.json, the one published pause reading (the same block every
     other tab renders and the spawn gate itself consults). Same pattern as the feeds above, with one
     deliberate difference: a miss is NOT graceful-null here. An absent pause reading is reported as
     "we cannot tell", never as silence, because silence on this particular question reads as "fine".*/
  function pollStatus(){
    fetch(bust("./status.json"),{cache:"no-cache"}).then(function(r){ return r.ok? r.json() : null; })
      .then(function(j){ var p=(j && j.pause)?j.pause:null; setPause(p, !!p); tickStrip(); })
      .catch(function(){ setPause(null,false); tickStrip(); });
  }
  pollStatus(); setInterval(pollStatus,60000);
  setInterval(function(){ updAgo(); tickChips(); tickProv(); tickStrip(); }, 1000);
  setInterval(tickElapsed, 15000);

  /* ---------- queue-edit bar: build, sync across tabs, warn on leave ---------- */
  buildBar(); updateBar();
  window.addEventListener("storage", function(e){ if(e.key===QKEY){ rerender(); updateBar(); } });
  window.addEventListener("beforeunload", function(e){
    if(loadOps().length){ e.preventDefault(); e.returnValue=""; return ""; }
  });
})();
</script>
